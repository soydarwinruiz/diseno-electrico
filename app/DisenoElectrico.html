<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Diseño Eléctrico Residencial · RETIE / NTC 2050</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#eef1f5;--pn:#fff;--ln:#d6dce4;--ac:#1565c0;--tx:#1f2933;--mu:#64748b;--er:#c62828;--wa:#e08600;--ok:#2e7d32}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Segoe UI",system-ui,Arial,sans-serif;font-size:13px;color:var(--tx);background:var(--bg);overflow:hidden}
button,select,input{font:inherit}
#app{display:grid;grid-template-rows:auto auto 1fr auto;grid-template-columns:220px 1fr 370px;height:100vh}
.cc{border:1px solid #dde3ea;border-radius:6px;padding:6px;margin:6px 0;background:#fafbfd}
.cc1{display:flex;gap:6px;align-items:center}.cc1 input{flex:1;padding:3px 5px;border:1px solid #c9d1db;border-radius:4px}
.cc2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) minmax(0,1fr);gap:4px 6px;margin-top:5px}.cc2 label{display:flex;flex-direction:column;font-size:11px;color:var(--mu)}.cc2 select{width:100%;padding:2px;border:1px solid #c9d1db;border-radius:4px;font-size:12px;color:var(--tx)}
#menubar{grid-column:1/4;display:flex;align-items:center;gap:4px;padding:5px 8px;background:#12355f;color:#fff}
#menubar .brand{font-weight:700;font-size:15px;margin-right:14px;white-space:nowrap}
#menubar .brand small{font-weight:400;opacity:.75;font-size:11px;margin-left:6px}
#menubar button{background:transparent;color:#fff;border:1px solid transparent;border-radius:4px;padding:4px 10px;cursor:pointer}
#menubar button:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25)}
#menubar input{margin-left:auto;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:4px;padding:4px 8px;width:220px}
#toolbar{grid-column:1/4;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:5px 8px;background:#fff;border-bottom:1px solid var(--ln)}
.grp{display:flex;gap:3px;align-items:center;padding-right:8px;border-right:1px solid var(--ln)}
.grp:last-child{border-right:0}
.tb{border:1px solid var(--ln);background:#f8fafc;border-radius:5px;padding:4px 9px;cursor:pointer;white-space:nowrap}
.tb:hover{background:#e8f0fb}
.tb.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tb.sim.on{background:#f9a825;border-color:#f9a825;color:#222}
.sw{width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #9aa3ac;cursor:pointer;display:inline-block}
.sw.on{box-shadow:0 0 0 2px var(--ac)}
#palette{grid-row:3;overflow:auto;background:#fff;border-right:1px solid var(--ln);padding:6px}
#palette h4{margin:10px 4px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}
.pi{display:flex;align-items:center;gap:8px;padding:3px 5px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.pi:hover{background:#eef4fc}
.pi.on{background:#dceafc;border-color:#9cc2f0}
.pi svg{flex:none;background:#f3f5f8;border-radius:6px}
.pi span{line-height:1.15}
#wrap{grid-row:3;position:relative;overflow:hidden;background:#fbfcfd}
#cv{width:100%;height:100%;display:block;touch-action:none;user-select:none}
#cv.m-wire .th:hover{fill:rgba(21,101,192,.35)}
#cv.m-place,#cv.m-wall,#cv.m-room,#cv.m-wire{cursor:crosshair}
#cv.m-pan{cursor:grab}
#side{grid-row:3;overflow:hidden;background:#fff;border-left:1px solid var(--ln);display:flex;flex-direction:column}
.tabs{display:flex;border-bottom:1px solid var(--ln)}
.tabs button{flex:1;border:0;background:#f5f7fa;padding:8px 2px;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{background:#fff;border-bottom-color:var(--ac);font-weight:600}
#sideBody{overflow:auto;padding:10px;flex:1}
#sideBody h3{margin:2px 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
#sideBody h4{margin:14px 0 6px;font-size:13px}
.row{display:grid;grid-template-columns:118px 1fr;gap:6px;align-items:center;margin:5px 0}
.row label{color:var(--mu)}
.row input,.row select{width:100%;padding:3px 5px;border:1px solid #c9d1db;border-radius:4px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.btn{border:1px solid #c9d1db;background:#f8fafc;border-radius:5px;padding:5px 10px;cursor:pointer}
.btn:hover{background:#e8f0fb}
.btn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn.danger{color:var(--er);border-color:#e6b4b4}
.note{background:#f1f6fd;border:1px solid #cfe0f5;border-radius:6px;padding:7px 9px;margin:8px 0;color:#30425a;line-height:1.35}
.warnbox{background:#fff6e5;border-color:#f3d39b}
table.t{border-collapse:collapse;width:100%;font-size:12px}
table.t th,table.t td{border:1px solid #dde3ea;padding:3px 4px;text-align:left}
table.t th{background:#f1f4f8;font-weight:600}
table.t td.n{text-align:right}
table.t input,table.t select{width:100%;border:1px solid #d3dae3;border-radius:3px;padding:1px 2px;font-size:12px}
.iss{display:flex;gap:8px;padding:6px 6px;border-bottom:1px solid #eef1f4;cursor:pointer;line-height:1.3}
.iss:hover{background:#f5f8fc}
.dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:4px}
.l-error .dot{background:var(--er)}.l-warn .dot{background:var(--wa)}.l-info .dot{background:#64b5f6}.l-ok .dot{background:var(--ok)}
#badge{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:var(--er);color:#fff;font-size:11px}
#badge:empty{display:none}
#status{grid-column:1/4;display:flex;gap:16px;padding:3px 10px;background:#f1f4f8;border-top:1px solid var(--ln);color:#4a5563;font-size:12px}
#status #hint{flex:1}
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#263238;color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s;max-width:70vw;z-index:50}
#toast.show{opacity:1}
#toast.err{background:#b71c1c}
#modal{position:fixed;inset:0;background:rgba(15,25,40,.45);display:none;align-items:center;justify-content:center;z-index:40}
#modal.show{display:flex}
#modal .box{background:#fff;border-radius:10px;max-width:760px;max-height:85vh;overflow:auto;padding:18px 22px;box-shadow:0 12px 40px rgba(0,0,0,.3);line-height:1.45}
#modal h2{margin-top:0}
.chip{display:inline-block;padding:0 5px;border-radius:4px;color:#fff;font-size:11px;font-weight:600}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .7s linear infinite}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(14deg)}75%{transform:rotate(-14deg)}}
.ring{animation:ring .22s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.live{stroke-dasharray:4 8;animation:flow .5s linear infinite}
#print{display:none}
@media print{
 @page{size:landscape;margin:10mm}
 html,body{overflow:visible;height:auto;background:#fff}
 #app,#toast,#modal{display:none!important}
 #print{display:block}
 #print svg{width:100%;height:auto;max-height:180mm}
 #print .pg{page-break-after:always}
 #print table{font-size:10px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
 <defs id="defs">
  <linearGradient id="gPlate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dde2e8"/></linearGradient>
  <linearGradient id="gRocker" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3e7ec"/></linearGradient>
  <radialGradient id="gGlassOff" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#e9eef3"/><stop offset="1" stop-color="#c5cfd9"/></radialGradient>
  <radialGradient id="gGlassOn" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#fffef2"/><stop offset=".5" stop-color="#fff29a"/><stop offset="1" stop-color="#ffc928"/></radialGradient>
  <radialGradient id="gHalo"><stop offset="0" stop-color="#ffe680" stop-opacity=".85"/><stop offset=".5" stop-color="#ffe680" stop-opacity=".35"/><stop offset="1" stop-color="#ffe680" stop-opacity="0"/></radialGradient>
  <linearGradient id="gBase" x1="0" x2="1"><stop offset="0" stop-color="#8d939a"/><stop offset=".5" stop-color="#e6e9ec"/><stop offset="1" stop-color="#7b8188"/></linearGradient>
  <linearGradient id="gMetal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0e5ea"/><stop offset="1" stop-color="#99a2ab"/></linearGradient>
  <linearGradient id="gBrass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dc84"/><stop offset="1" stop-color="#b8860b"/></linearGradient>
  <linearGradient id="gCopper" x1="0" x2="1"><stop offset="0" stop-color="#9c5a24"/><stop offset=".5" stop-color="#eaa66b"/><stop offset="1" stop-color="#9c5a24"/></linearGradient>
  <radialGradient id="gLed" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe7ef"/></radialGradient>
  <linearGradient id="gWood" x1="0" x2="1"><stop offset="0" stop-color="#a1887f"/><stop offset="1" stop-color="#6d4c41"/></linearGradient>
  <pattern id="gridS" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#eef1f4" stroke-width=".6"/></pattern>
  <pattern id="gridB" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="url(#gridS)"/><path d="M100 0H0V100" fill="none" stroke="#dde3ea" stroke-width="1.2"/></pattern>
 </defs>
</svg>

<div id="app">
 <div id="menubar">
  <div class="brand">⚡ Diseño Eléctrico Residencial<small>RETIE · NTC 2050</small></div>
  <button data-m="new">Nuevo</button>
  <button data-m="open">Abrir…</button>
  <button data-m="save">Guardar</button>
  <button data-m="saveas">Guardar como…</button>
  <button data-m="png">Exportar imagen</button>
  <button data-m="print">Imprimir / PDF</button>
  <button data-m="sample">Casa de ejemplo</button>
  <button data-m="help">Ayuda</button>
  <input id="projName" title="Nombre del proyecto">
  <input id="fileIn" type="file" accept=".json,.elec,application/json" style="display:none">
  <input id="imgIn" type="file" accept="image/*" style="display:none">
 </div>
 <div id="toolbar">
  <div class="grp">
   <button class="tb" data-mode="select" title="Seleccionar y mover (V)">🖱 Seleccionar</button>
   <button class="tb" data-mode="pan" title="Desplazar la vista (Espacio + arrastrar)">✋ Vista</button>
   <button class="tb" data-mode="wall" title="Dibujar muros (M)">🧱 Muro</button>
   <button class="tb" data-mode="room" title="Dibujar espacio / habitación (H)">⬚ Espacio</button>
   <button class="tb" data-mode="wire" title="Dibujar cable entre bornes (C)">〰 Cable</button>
   <button class="tb sim" data-mode="sim" title="Probar el circuito (S)">▶ Simular</button>
  </div>
  <div class="grp" id="wireOpts">
   <span>Cable:</span><span id="swatches"></span>
   <select id="gaugeSel" title="Calibre AWG por defecto"></select>
   <label title="Neutro blanco y tierra verde automáticamente según el borne"><input type="checkbox" id="autoColor" checked> color auto</label>
  </div>
  <div class="grp">
   <button class="tb" data-a="undo" title="Deshacer (Ctrl+Z)">↶</button>
   <button class="tb" data-a="redo" title="Rehacer (Ctrl+Y)">↷</button>
   <button class="tb" data-a="rot" title="Rotar (R)">⟳ Rotar</button>
   <button class="tb" data-a="del" title="Eliminar (Supr)">🗑</button>
   <button class="tb" data-a="auto" title="Cablear automáticamente lo seleccionado">⚙ Conexión automática</button>
  </div>
  <div class="grp">
   <button class="tb" data-a="zout">−</button>
   <button class="tb" data-a="fit" title="Ver todo">Ajustar</button>
   <button class="tb" data-a="zin">+</button>
   <label><input type="checkbox" id="showLabels" checked> etiquetas</label>
   <label><input type="checkbox" id="showGrid" checked> cuadrícula</label>
  </div>
 </div>
 <div id="palette"></div>
 <div id="wrap">
  <svg id="cv"><g id="world"><g id="layer"></g><g id="ov"></g></g></svg>
 </div>
 <div id="side">
  <div class="tabs">
   <button data-tab="prop" class="on">Propiedades</button>
   <button data-tab="panel">Tablero</button>
   <button data-tab="check">Revisión <span id="badge"></span></button>
   <button data-tab="mat">Materiales</button>
  </div>
  <div id="sideBody"></div>
 </div>
 <div id="status"><span id="hint"></span><span id="coords"></span><span id="zoomTxt"></span></div>
</div>
<div id="toast"></div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="print"></div>

<script>
"use strict";
// =====================================================================
//  Utilidades
// =====================================================================
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1=n=>(Math.round(n*10)/10).toLocaleString('es-CO');
const f0=n=>Math.round(n).toLocaleString('es-CO');
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// =====================================================================
//  Datos normativos y de colores
// =====================================================================
const COLORS={
 negro:{n:'Negro',c:'#1d1d1d',o:'#000'}, rojo:{n:'Rojo',c:'#c62828',o:'#7f1414'}, azul:{n:'Azul',c:'#1e5bc6',o:'#0e357a'},
 amarillo:{n:'Amarillo',c:'#f2c200',o:'#9a7a00'}, blanco:{n:'Blanco',c:'#fafafa',o:'#8a8f96'}, gris:{n:'Gris',c:'#9aa0a6',o:'#5f656b'},
 verde:{n:'Verde',c:'#2e7d32',o:'#174d1a'}, verdeamarillo:{n:'Verde-amarillo',c:'#2e7d32',o:'#174d1a',stripe:'#f2c200'},
 desnudo:{n:'Desnudo (cobre)',c:'#cf8445',o:'#7a4519'}, naranja:{n:'Naranja',c:'#ef6c00',o:'#8a3e00'}, cafe:{n:'Café',c:'#6d4c41',o:'#3e2723'}
};
const NEU_COL=['blanco','gris'], GND_COL=['verde','verdeamarillo','desnudo'];
const GAUGES=['14','12','10','8','6','4'];
const AMP={'14':15,'12':20,'10':30,'8':40,'6':55,'4':70};          // NTC 2050 Tabla 310-16 (60 °C) con límites de la Secc. 240-3
const BREAKERS=[15,20,30,40,50,60,70];
const KINDS={
 iluminacion:{n:'Iluminación',br:15,g:'14',p:1},
 tomas:{n:'Tomas generales',br:20,g:'12',p:1},
 cocina:{n:'Cocina – pequeños artefactos',br:20,g:'12',p:1},
 lavanderia:{n:'Lavandería',br:20,g:'12',p:1},
 bano:{n:'Baño',br:20,g:'12',p:1},
 ducha:{n:'Ducha eléctrica 240 V',br:30,g:'10',p:2},
 estufa:{n:'Estufa 240 V',br:40,g:'8',p:2},
 especial:{n:'Especial / otro',br:20,g:'12',p:1}
};
const ROOMT={alcoba:'Alcoba',sala:'Sala',comedor:'Comedor',cocina:'Cocina',bano:'Baño',lavadero:'Lavadero / patio de ropas',garaje:'Garaje',exterior:'Exterior / balcón',pasillo:'Pasillo / escalera',estudio:'Estudio',otro:'Otro'};
const ROOMC={alcoba:'#e8f1fb',sala:'#fdf3e1',comedor:'#fbefd9',cocina:'#fde9e5',bano:'#e0f4f3',lavadero:'#e9f3e1',garaje:'#eeeeee',exterior:'#eef7e6',pasillo:'#f4f1fa',estudio:'#f0f4e6',otro:'#f5f5f5'};
const HABITABLE=['alcoba','sala','comedor','estudio'];
const WET=['bano','cocina','exterior','garaje','lavadero'];
const CCOL=['#1565c0','#c62828','#2e7d32','#6a1b9a','#ef6c00','#00838f','#ad1457','#4e342e','#283593','#558b2f','#00695c','#d84315'];

// =====================================================================
//  Dibujos realistas de los aparatos (coordenadas locales, centrados)
// =====================================================================
const screw=(x,y)=>`<circle cx="${x}" cy="${y}" r="1.3" fill="#d5d9de" stroke="#8a929b" stroke-width=".4"/><line x1="${x-.8}" y1="${y}" x2="${x+.8}" y2="${y}" stroke="#8a929b" stroke-width=".4"/>`;
const plate=(w,h)=>`<rect x="${-w/2+1.2}" y="${-h/2+1.6}" width="${w}" height="${h}" rx="3" fill="rgba(0,0,0,.16)"/><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="3" fill="url(#gPlate)" stroke="#a9b1ba" stroke-width=".7"/>`+screw(0,-h/2+3.2)+screw(0,h/2-3.2);
function rocker(cx,cy,w,h,on){
 return `<rect x="${cx-w/2}" y="${cy-h/2}" width="${w}" height="${h}" rx="1.6" fill="url(#gRocker)" stroke="#b3bac3" stroke-width=".6"/>`+
  `<rect x="${cx-w/2+.6}" y="${on?cy-h/2+.6:cy}" width="${w-1.2}" height="${h/2-.6}" rx="1.2" fill="rgba(60,70,80,.11)"/>`+
  `<rect x="${cx-.5}" y="${on?cy-h/2+2:cy+h/2-5}" width="1" height="3" rx=".5" fill="${on?'#43a047':'#a3abb4'}"/>`;
}
function face(cx,cy){ // cara de tomacorriente tipo NEMA 5-15 (usada en Colombia)
 return `<rect x="${cx-7}" y="${cy-6}" width="14" height="12" rx="5" fill="#f5f2eb" stroke="#b7b1a3" stroke-width=".6"/>`+
  `<rect x="${cx-4.3}" y="${cy-3.9}" width="1.4" height="4.3" rx=".3" fill="#2b2b2b"/>`+
  `<rect x="${cx+2.9}" y="${cy-4.4}" width="1.4" height="5.3" rx=".3" fill="#2b2b2b"/>`+
  `<path d="M${cx-1.25} ${cy+4.4} v-1.3 a1.25 1.25 0 0 1 2.5 0 v1.3 z" fill="#2b2b2b"/>`;
}
const tiny=(x,y,t,c='#8a929b',fs=3.4)=>`<text x="${x}" y="${y}" font-size="${fs}" fill="${c}" text-anchor="middle" font-family="Segoe UI,Arial" font-weight="600">${t}</text>`;
const halo=(r,cy=0)=>`<circle cx="0" cy="${cy}" r="${r}" fill="url(#gHalo)"/>`;

const DRAW={
 bombillo:(d,on)=>(on?halo(36,-6):'')+
  `<ellipse cx="0" cy="17.5" rx="8" ry="1.8" fill="rgba(0,0,0,.14)"/>`+
  `<path d="M-5 5 C-5 0 -11 -1 -11 -7 A11 11 0 1 1 11 -7 C11 -1 5 0 5 5 Z" fill="url(#${on?'gGlassOn':'gGlassOff'})" stroke="${on?'#e0a800':'#a7b1bb'}" stroke-width=".7"/>`+
  `<path d="M-2.5 4 L-2.5 -3 M2.5 4 L2.5 -3 M-2.5 -3 q1.25 -2.6 2.5 0 q1.25 2.6 2.5 0" fill="none" stroke="${on?'#ff8f00':'#8d7b5a'}" stroke-width="${on?1:.6}"/>`+
  `<ellipse cx="-4.5" cy="-11" rx="2.2" ry="3.6" fill="rgba(255,255,255,.75)" transform="rotate(-30 -4.5 -11)"/>`+
  `<rect x="-5.5" y="5" width="11" height="9" rx="1" fill="url(#gBase)" stroke="#6f767d" stroke-width=".5"/>`+
  `<path d="M-5.5 7.5h11M-5.5 10h11M-5.5 12.5h11" stroke="#7b8188" stroke-width=".5"/><path d="M-3 14h6l-1.5 3h-3z" fill="#333"/>`,
 led:(d,on)=>(on?halo(38):'')+`<circle r="16.5" cx=".8" cy="1.2" fill="rgba(0,0,0,.15)"/><circle r="16" fill="#f3f5f8" stroke="#aeb7c0" stroke-width=".7"/>`+
  `<circle r="12.5" fill="url(#${on?'gGlassOn':'gLed'})" stroke="#d0d7df" stroke-width=".5"/>`+
  [...Array(10)].map((_,i)=>{const a=i*Math.PI/5;return `<circle cx="${(8.5*Math.cos(a)).toFixed(2)}" cy="${(8.5*Math.sin(a)).toFixed(2)}" r="1" fill="${on?'#fff':'#cfd8e0'}"/>`}).join(''),
 aplique:(d,on)=>(on?halo(32,2):'')+`<rect x="-10" y="-17" width="20" height="6" rx="1.5" fill="url(#gMetal)" stroke="#7b848d" stroke-width=".5"/>`+
  `<rect x="-1.5" y="-11" width="3" height="5" fill="#8a929b"/>`+
  `<path d="M-14 -6 Q-12 16 0 16 Q12 16 14 -6 Z" fill="${on?'url(#gGlassOn)':'#f2ecd9'}" stroke="#c4b994" stroke-width=".7"/>`+
  `<path d="M-14 -6 Q0 -2 14 -6" fill="none" stroke="#c4b994" stroke-width=".7"/>`,
 ventilador:(d,on)=>`<g class="${on?'spin':''}">`+[0,120,240].map(a=>`<g transform="rotate(${a})"><ellipse cx="12" cy="0" rx="11" ry="4.2" fill="url(#gWood)" stroke="#4e342e" stroke-width=".5"/><rect x="2" y="-1" width="5" height="2" fill="#777"/></g>`).join('')+`</g>`+
  `<circle r="6" fill="url(#gMetal)" stroke="#6b737c" stroke-width=".6"/><circle r="3.4" fill="url(#${on?'gGlassOn':'gGlassOff'})"/>`,

function fixState(){
 const d0=newState();
 for(const k of Object.keys(d0)) if(state[k]===undefined) state[k]=d0[k];

 state.devices=state.devices.filter(d=>CAT[d.type]);

}
function cleanWires(){state.wires=state.wires.filter(w=>{const a=dev(w.a.d),b=dev(w.b.d);return a&&b&&termsOf(a).some(t=>t.k===w.a.t)&&termsOf(b).some(t=>t.k===w.b.t)})}

function termsOf(d){
 const c=CAT[d.type]; if(!c) return [];
 if(d.type==='tablero'){
  const g=panelGeom(state.circuits); const out=[];
  g.rows.forEach((r,j)=>out.push(T('C'+r.c.id+r.p,g.W/2+5,g.y0+j*g.RH+g.RH/2,'f')));
  out.push(T('N',-22,g.H/2+5,'n'),T('T',22,g.H/2+5,'t')); return out;
 }
 return c.terms||[];
}
const tType=(d,k)=>(termsOf(d).find(t=>t.k===k)||{}).t;
const scaleOf=d=>CAT[d.type].arch?1:state.iconScale;
function local2w(d,x,y){const s=scaleOf(d),a=(d.r||0)*Math.PI/180;x*=s;y*=s;return{x:d.x+x*Math.cos(a)-y*Math.sin(a),y:d.y+x*Math.sin(a)+y*Math.cos(a)}}
function w2local(d,p){const s=scaleOf(d),a=-(d.r||0)*Math.PI/180,dx=p.x-d.x,dy=p.y-d.y;return{x:(dx*Math.cos(a)-dy*Math.sin(a))/s,y:(dx*Math.sin(a)+dy*Math.cos(a))/s}}
function tpos(d,k){const t=termsOf(d).find(t=>t.k===k);return t?local2w(d,t.x,t.y):{x:d.x,y:d.y}}
function bbOf(d){const c=CAT[d.type]; if(d.type==='tablero'){const g=panelGeom(state.circuits);return[g.W+14,g.H+14]} if(c.arch) return [(d.w||100)+6,d.type==='puerta'?(d.w||90)*2+6:22]; return c.bb||[40,40]}
function wirePts(w){const a=dev(w.a.d),b=dev(w.b.d);return [tpos(a,w.a.t),...w.pts.map(p=>({x:p[0],y:p[1]})),tpos(b,w.b.t)]}
function wireLen(w){const p=wirePts(w);let L=0;for(let i=1;i<p.length;i++)L+=dist(p[i-1],p[i]);return L}
function roomOf(d){let best=null;for(const r of state.rooms){if(d.x>=r.x&&d.x<=r.x+r.w&&d.y>=r.y&&d.y<=r.y+r.h){if(!best||r.w*r.h<best.w*best.h)best=r}}return best}
const devsIn=r=>state.devices.filter(d=>roomOf(d)===r);

// =====================================================================
function internal(d){
 const s=d.st||[];
 switch(d.type){
  case 'int_sencillo': case 'pulsador': return s[0]?[['COM','S']]:[];
  case 'int_doble': return [s[0]&&['COM','S1'],s[1]&&['COM','S2']].filter(Boolean);
  case 'int_triple': return [s[0]&&['COM','S1'],s[1]&&['COM','S2'],s[2]&&['COM','S3']].filter(Boolean);
  case 'int_conmutable': return [['COM',s[0]?'V2':'V1']];
  case 'int_cruce': return s[0]?[['A1','B2'],['A2','B1']]:[['A1','B1'],['A2','B2']];
  case 'int_toma': return s[0]?[['L','S']]:[];
 }
 return [];
}
class UF{constructor(){this.p=new Map()}f(x){if(!this.p.has(x))this.p.set(x,x);let r=x;while(this.p.get(r)!==r)r=this.p.get(r);while(this.p.get(x)!==r){const n=this.p.get(x);this.p.set(x,r);x=n}return r}u(a,b){this.p.set(this.f(a),this.f(b))}}
function buildNet(withSwitches){
 const uf=new UF();
 state.wires.forEach(w=>uf.u(w.a.d+':'+w.a.t,w.b.d+':'+w.b.t));
 if(withSwitches) state.devices.forEach(d=>internal(d).forEach(([a,b])=>uf.u(d.id+':'+a,d.id+':'+b)));
 return uf;
}
function simulate(){
 const msgs=[];
 for(let it=0;it<20;it++){
  const uf=buildNet(true), pot=new Map(), panel=getPanel();
  const add=(k,p,src)=>{const r=uf.f(k);if(!pot.has(r))pot.set(r,{p:new Set(),src:new Set()});const o=pot.get(r);o.p.add(p);if(src)o.src.add(src)};
  if(panel){
   state.circuits.forEach(c=>{if(!c.on)return;
    if(c.poles==2){add(panel.id+':C'+c.id+'a','L1',c.id);add(panel.id+':C'+c.id+'b','L2',c.id)}

   add(panel.id+':N','N'); add(panel.id+':T','T');
  }
  let trip=new Set(), kind='';
  pot.forEach(o=>{const L=['L1','L2'].filter(x=>o.p.has(x));if(L.length&&(L.length>1||o.p.has('N')||o.p.has('T'))){o.src.forEach(s=>trip.add(s));kind=o.p.has('T')?'falla a tierra':'cortocircuito'}});
  if(trip.size){trip.forEach(id=>{const c=circ(id);c.on=false;c.tripped=true;msgs.push(`¡${kind[0].toUpperCase()+kind.slice(1)} en ${cName(id)} (${c.name})! El breaker se disparó.`)});continue}
  const P=(d,k)=>{const o=pot.get(uf.f(d.id+':'+k));return o?[...o.p][0]:null};
  const res={dev:{},live:new Set(),msgs};
  state.devices.forEach(d=>{
   const c=CAT[d.type]; let st=null;
   if(c.kind==='luz'||c.kind==='toma'){
    const a=P(d,d.type==='int_toma'?'L':'F'), b=P(d,'N'), Ls=x=>x==='L1'||x==='L2';
    if(Ls(a)&&b==='N') st='ok'; else if(a==='N'&&Ls(b)) st='pol'; else if(Ls(a)&&Ls(b)&&a!==b) st='sobre';
    if(c.kind==='toma'&&st) res.dev[d.id]={on:true,st,gnd:P(d,'T')==='T'};
    else res.dev[d.id]={on:st==='ok'||st==='pol',st};
   } else if(c.kind==='t220'){

   }
  });
  state.wires.forEach(w=>{const p=P(dev(w.a.d),w.a.t);if(p==='L1'||p==='L2')res.live.add(w.id)});
  return res;
 }

}
function route(A,B,off){
 if(Math.abs(A.x-B.x)<1||Math.abs(A.y-B.y)<1) return [];
 const M=Math.round((A.y+(B.y-A.y)/2+off)/2.5)*2.5;
 return [[A.x,M],[B.x,M]];
}
function defaultCircuits(){
 ['iluminacion','tomas','cocina','cocina','lavanderia','bano'].forEach(k=>addCircuit(k));
}
function addCircuit(kind){
 const K=KINDS[kind], n=state.circuits.filter(c=>c.kind===kind).length;
 const fase=K.p==2?'AB':(state.circuits.filter(c=>c.poles!=2).length%2?'B':'A');
 const c={id:uid(),kind,name:K.n+(n?' '+(n+1):''),breaker:K.br,gauge:K.g,poles:K.p,fase,dif:false,on:true};
 state.circuits.push(c); return c;
}
const countDev=c=>state.devices.filter(d=>d.c===c.id).length;
function defaultCircuit(d){
 const k=CAT[d.type].kind, rt=(roomOf(d)||{}).type; let want;
 if(k==='luz'||(SWITCHES.includes(d.type)&&d.type!=='int_toma')) want=['iluminacion'];
 else if(k==='toma') want=rt==='cocina'?['cocina','tomas']:rt==='bano'?['bano','tomas']:rt==='lavadero'?['lavanderia','tomas']:['tomas'];
 else if(d.type==='ducha') want=['ducha']; else if(d.type==='toma_220') want=['estufa'];
 else return null;
 for(const w of want){const cs=state.circuits.filter(c=>c.kind===w); if(cs.length){
  if(w==='cocina') return cs.sort((a,b)=>countDev(a)-countDev(b))[0].id;
  return (cs.find(c=>countDev(c)<8)||cs.sort((a,b)=>countDev(a)-countDev(b))[0]).id}}
 return null;
}
function ensureCircuit(kind){return state.circuits.find(c=>c.kind===kind)||addCircuit(kind)}

// ---------------------------------------------------------------------
//  Conexión automática
// ---------------------------------------------------------------------
const wiresAt=(id,t)=>state.wires.filter(w=>(w.a.d===id&&w.a.t===t)||(w.b.d===id&&w.b.t===t));
function colorFor(role,c,pole){
 const C=state.colors;
 if(role==='neutro') return 'blanco'; if(role==='tierra') return 'verde';
 if(role==='retorno') return C.retorno; if(role==='viajero') return C.viajero;
 if(c.poles==2) return pole==='b'?C.faseB:C.faseA;
 return c.fase==='B'?C.faseB:C.faseA;
}
const OFF={fase:-7.5,neutro:0,tierra:7.5,retorno:-3.75,viajero:3.75};
function addWire(a,b,role,c,pole){
 const A=tpos(dev(a.d),a.t),B=tpos(dev(b.d),b.t);
 let gauge=c.gauge; if(role==='tierra') gauge=c.breaker<=15?'14':c.breaker<=20?'12':'10';
 const w={id:uid(),a,b,pts:route(A,B,OFF[role]||0),color:colorFor(role,c,pole),gauge,role,c:c.id,pole:pole||'a'};
 state.wires.push(w); return w;
}
function feed(c,role,pole,target){
 if(wiresAt(target.d,target.t).length) return;
 const panel=getPanel(), cands=[];
 if(role==='fase') cands.push({d:panel.id,t:'C'+c.id+(pole||'a')});
 if(role==='neutro') cands.push({d:panel.id,t:'N'});
 if(role==='tierra') cands.push({d:panel.id,t:'T'});
 state.wires.forEach(w=>{if(w.role===role&&w.c===c.id&&(role!=='fase'||(w.pole||'a')===(pole||'a')))[w.a,w.b].forEach(e=>{if(e.d!==panel.id&&!(e.d===target.d&&e.t===target.t))cands.push(e)})});
 const P=tpos(dev(target.d),target.t);
 let best=cands[0],bd=1e9; cands.forEach(e=>{const q=dist(tpos(dev(e.d),e.t),P);if(q<bd){bd=q;best=e}});
 addWire(best,target,role,c,pole);
}
function orderNN(list,from){const out=[],rest=[...list];let p=from;while(rest.length){let bi=0,bd=1e9;rest.forEach((d,i)=>{const q=dist(d,p);if(q<bd){bd=q;bi=i}});p=rest[bi];out.push(rest.splice(bi,1)[0])}return out}
function autoConnect(ids,silent){
 const panel=getPanel(); if(!panel){if(!silent)toast('Primero coloque el TABLERO en el plano.',true);return false}
 const ds=ids.map(dev).filter(d=>d&&!CAT[d.type].arch&&d.type!=='tablero');
 if(!ds.length){if(!silent)toast('Seleccione aparatos (Shift+clic o arrastrando un recuadro) y luego pulse Conexión automática.',true);return false}
 pushUndo();
 const lights=ds.filter(isLight), sws=ds.filter(d=>SWITCHES.includes(d.type)), msgs=[];
 // ---------- iluminación ----------
 if(lights.length){
  const conm=sws.filter(d=>d.type==='int_conmutable'), cru=sws.filter(d=>d.type==='int_cruce'), simple=sws.filter(d=>!['int_conmutable','int_cruce'].includes(d.type));
  const it=simple.find(d=>d.type==='int_toma');
  let c=(it&&it.c&&circ(it.c))||lights.map(l=>circ(l.c)).find(Boolean)||ensureCircuit('iluminacion');
  [...lights,...sws].forEach(d=>d.c=c.id);
  const COMk=d=>d.type==='int_toma'?'L':'COM';
  const lightChain=(start,group)=>{let prev=start;orderNN(group,tpos(dev(start.d),start.t)).forEach(l=>{if(!wiresAt(l.id,'F').length)addWire(prev,{d:l.id,t:'F'},'retorno',c);prev={d:l.id,t:'F'}})};
  if(!sws.length){msgs.push('Las luces no tienen interruptor seleccionado: se conectaron fijas (siempre encendidas).');lights.forEach(l=>feed(c,'fase','a',{d:l.id,t:'F'}))}
  else if(!conm.length&&!cru.length){
   const gangs=[];orderNN(simple,panel).forEach(s=>{({int_doble:['S1','S2'],int_triple:['S1','S2','S3']}[s.type]||['S']).forEach(o=>gangs.push({s,o}))});
   orderNN(simple,panel).forEach(s=>feed(c,'fase','a',{d:s.id,t:COMk(s)}));
   const groups=gangs.map(()=>[]); orderNN(lights,tpos(gangs[0].s,gangs[0].o)).forEach((l,i)=>groups[i%gangs.length].push(l));
   groups.forEach((g,i)=>{if(g.length)lightChain({d:gangs[i].s.id,t:gangs[i].o},g)});
  } else if(conm.length===2&&!simple.length){
   const [e1,e2]=orderNN(conm,panel); const mids=orderNN(cru,e1);
   feed(c,'fase','a',{d:e1.id,t:'COM'});
   let prev=[{d:e1.id,t:'V1'},{d:e1.id,t:'V2'}];
   mids.forEach(m=>{addWire(prev[0],{d:m.id,t:'A1'},'viajero',c);addWire(prev[1],{d:m.id,t:'A2'},'viajero',c);prev=[{d:m.id,t:'B1'},{d:m.id,t:'B2'}]});
   addWire(prev[0],{d:e2.id,t:'V1'},'viajero',c); addWire(prev[1],{d:e2.id,t:'V2'},'viajero',c);
   lightChain({d:e2.id,t:'COM'},lights);
  } else {
   undoS.pop();
   toast('Para controlar una luz desde 2 sitios use DOS interruptores conmutables; desde 3 o más sitios: dos conmutables en los extremos y interruptores de cruce (4 vías) en el medio. No mezcle con interruptores sencillos.',true);
   return false;
  }
  lights.forEach(l=>feed(c,'neutro',null,{d:l.id,t:'N'}));
 }
 // ---------- tomacorrientes y cargas especiales ----------
 const outs=ds.filter(d=>['toma','t220'].includes(CAT[d.type].kind));
 outs.forEach(d=>{if(!d.c||!circ(d.c)){d.c=defaultCircuit(d);if(!d.c){d.c=ensureCircuit(d.type==='ducha'?'ducha':d.type==='toma_220'?'estufa':'tomas').id}}});
 const byC={}; outs.forEach(d=>(byC[d.c]=byC[d.c]||[]).push(d));
 Object.entries(byC).forEach(([cid,list])=>{const c=circ(cid);
  orderNN(list,panel).forEach(d=>{
   if(CAT[d.type].kind==='t220'){
    if(c.poles!=2) msgs.push(`${CAT[d.type].n}: el circuito ${cName(c.id)} debería ser de 2 polos (240 V).`);
    feed(c,'fase','a',{d:d.id,t:'F1'}); feed(c,'fase',c.poles==2?'b':'a',{d:d.id,t:'F2'}); feed(c,'tierra',null,{d:d.id,t:'T'});
   } else {
    feed(c,'fase','a',{d:d.id,t:d.type==='int_toma'?'L':'F'}); feed(c,'neutro',null,{d:d.id,t:'N'}); feed(c,'tierra',null,{d:d.id,t:'T'});
   }
  });
 });
 // ---------- timbre ----------
 // (el timbre es una carga tipo "luz" con pulsador sencillo: se resuelve arriba)
 // ---------- puesta a tierra ----------
 ds.filter(d=>d.type==='varilla').forEach(v=>{if(!wiresAt(v.id,'T').length){const A=tpos(panel,'T'),B=tpos(v,'T');state.wires.push({id:uid(),a:{d:panel.id,t:'T'},b:{d:v.id,t:'T'},pts:route(A,B,0),color:'desnudo',gauge:'8',role:'spt'})}});
 changed();
 if(!silent) toast('Conexión automática terminada.'+(msgs.length?' '+msgs.join(' '):'')+' Pruebe con ▶ Simular.');
 return true;
}

//  Revisión normativa (RETIE / NTC 2050)

function check(){
 const out=[], E=(m,ref)=>out.push({l:'error',m,ref}), W=(m,ref)=>out.push({l:'warn',m,ref}), I=(m,ref)=>out.push({l:'info',m,ref});
 const panel=getPanel();
 if(!panel) E('No hay tablero de distribución en el plano.');
 state.circuits.forEach((c,i)=>{
  const nm=`C${i+1} (${c.name})`, amp=AMP[c.gauge], devs=state.devices.filter(d=>d.c===c.id);
  if(c.breaker>amp) E(`${nm}: el breaker de ${c.breaker} A supera la capacidad del cable ${c.gauge} AWG (${amp} A). El breaker protege al cable. [NTC 2050 Secc. 240-3, Tabla 310-16]`,'c:'+c.id);
  const va=devs.reduce((s,d)=>s+(+d.va||0),0), V=c.poles==2?240:120, I_=va/V;
  if(I_>c.breaker*.8) W(`${nm}: carga ${f0(va)} VA = ${f1(I_)} A, supera el 80 % del breaker (${f1(c.breaker*.8)} A).`,'c:'+c.id);
  const nS=devs.filter(d=>isLight(d)||isOutlet(d)).length;
  if(c.poles!=2&&nS>10) W(`${nm}: tiene ${nS} salidas; se recomienda máximo 10 salidas por circuito (buena práctica).`,'c:'+c.id);
  const hasL=devs.some(isLight), hasT=devs.some(isOutlet);
  if(['cocina','lavanderia','bano'].includes(c.kind)&&hasL) E(`${nm}: los circuitos de 20 A de ${KINDS[c.kind].n.toLowerCase()} no deben alimentar alumbrado. [NTC 2050 Secc. 210-52(b)]`,'c:'+c.id);
  if(c.kind==='iluminacion'&&hasT) W(`${nm}: mezcla tomacorrientes en un circuito de iluminación; se recomienda separarlos.`,'c:'+c.id);
  if(['ducha','estufa'].includes(c.kind)&&devs.filter(d=>CAT[d.type].kind==='t220').length>1) W(`${nm}: un circuito de ${KINDS[c.kind].n} debe ser exclusivo para un solo aparato.`,'c:'+c.id);
  if(devs.some(d=>CAT[d.type].kind==='t220')&&c.poles!=2) E(`${nm}: alimenta una carga de 240 V pero el breaker es de 1 polo.`,'c:'+c.id);
  if(!devs.length) I(`${nm}: sin salidas asignadas (circuito de reserva).`,'c:'+c.id);
 });
 const hasRoom=t=>state.rooms.some(r=>r.type===t);
 if(hasRoom('cocina')&&state.circuits.filter(c=>c.kind==='cocina'&&c.breaker>=20).length<2) E('La cocina requiere mínimo DOS circuitos de 20 A para pequeños artefactos. [NTC 2050 Secc. 210-11(c)(1) y 210-52(b)]');
 if(hasRoom('lavadero')&&!state.circuits.some(c=>c.kind==='lavanderia')) E('Se requiere un circuito de 20 A exclusivo para la zona de lavandería. [NTC 2050 Secc. 210-11(c)(2)]');
 if(hasRoom('bano')&&!state.circuits.some(c=>c.kind==='bano')) E('Se requiere al menos un circuito de 20 A para los tomacorrientes de baño. [NTC 2050 Secc. 210-11(c)(3)]');
 state.devices.forEach(d=>{
  if(!isElec(d)) return;

function loadTable(){

  return {c,i,il:ds.filter(isLight).length,to:ds.filter(isOutlet).length,es:ds.filter(d=>CAT[d.type].kind==='t220').length,va,V,I:va/V}});
 let A=0,B=0,gen=0,esp=0; rows.forEach(r=>{if(r.c.poles==2){A+=r.va/2;B+=r.va/2}else if(r.c.fase==='B')B+=r.va;else A+=r.va; if(['ducha','estufa'].includes(r.c.kind)||r.es)esp+=r.va;else gen+=r.va});
 const area=state.rooms.filter(r=>!['exterior','garaje'].includes(r.type)).reduce((s,r)=>s+r.w*r.h/1e4,0);
 const gen2=Math.max(gen,area*32);
 const dem=Math.min(gen2,3000)+Math.max(0,gen2-3000)*.35+esp;
 const Id=dem/240, tot=[30,40,50,60,70,80,100,125,150,200].find(x=>x>=Id*1.25)||200;

}
function materials(){
 const devs={}, boxes={}, brk={}, cab={};
 state.devices.forEach(d=>{const C=CAT[d.type];if(C.arch)return;devs[C.n]=(devs[C.n]||0)+1;if(C.box)boxes[C.box]=(boxes[C.box]||0)+1});
 state.circuits.forEach(c=>{const k=`Breaker ${c.poles==2?'2':'1'} polo${c.poles==2?'s':''} ${c.breaker} A${c.dif?' (diferencial)':''}`;brk[k]=(brk[k]||0)+1});
 const hOf=d=>{const h=CAT[d.type].h||'';if(/Techo/.test(h))return 2.4;const m=h.match(/([\d,]+)\s*m/);return m?parseFloat(m[1].replace(',','.')):1.2};
 state.wires.forEach(w=>{const da=dev(w.a.d),db=dev(w.b.d);
  const drop=d=>d.type==='tablero'?1.0:d.type==='varilla'?0.5:Math.max(.3,2.4-hOf(d)+.3);
  const L=wireLen(w)/100+drop(da)+drop(db); const k=`${w.gauge} AWG ${COLORS[w.color].n}`; cab[k]=(cab[k]||0)+L});

function bounds(){
 let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9; const add=(x,y,m=0)=>{x1=Math.min(x1,x-m);y1=Math.min(y1,y-m);x2=Math.max(x2,x+m);y2=Math.max(y2,y+m)};
 state.rooms.forEach(r=>{add(r.x,r.y);add(r.x+r.w,r.y+r.h)}); state.walls.forEach(w=>{add(w.x1,w.y1,10);add(w.x2,w.y2,10)});
 state.devices.forEach(d=>{const [w,h]=bbOf(d);add(d.x,d.y,Math.max(w,h)/2*scaleOf(d)+12)}); state.wires.forEach(w=>w.pts.forEach(p=>add(p[0],p[1])));
 if(state.bg){add(state.bg.x,state.bg.y);add(state.bg.x+state.bg.w,state.bg.y+state.bg.h)}
 if(x1>x2) return {x:0,y:0,w:1000,h:700};
 return {x:x1-30,y:y1-30,w:x2-x1+60,h:y2-y1+60};
}

document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
