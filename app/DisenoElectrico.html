<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Diseño Eléctrico Residencial · RETIE / NTC 2050</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#eef1f5;--pn:#fff;--ln:#d6dce4;--ac:#1565c0;--tx:#1f2933;--mu:#64748b;--er:#c62828;--wa:#e08600;--ok:#2e7d32}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Segoe UI",system-ui,Arial,sans-serif;font-size:13px;color:var(--tx);background:var(--bg);overflow:hidden}
button,select,input{font:inherit}
#app{display:grid;grid-template-rows:auto auto 1fr auto;grid-template-columns:220px 1fr 370px;height:100vh}
.cc{border:1px solid #dde3ea;border-radius:6px;padding:6px;margin:6px 0;background:#fafbfd}
.cc1{display:flex;gap:6px;align-items:center}.cc1 input{flex:1;padding:3px 5px;border:1px solid #c9d1db;border-radius:4px}
.cc2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) minmax(0,1fr);gap:4px 6px;margin-top:5px}.cc2 label{display:flex;flex-direction:column;font-size:11px;color:var(--mu)}.cc2 select{width:100%;padding:2px;border:1px solid #c9d1db;border-radius:4px;font-size:12px;color:var(--tx)}
#menubar{grid-column:1/4;display:flex;align-items:center;gap:4px;padding:5px 8px;background:#12355f;color:#fff}
#menubar .brand{font-weight:700;font-size:15px;margin-right:14px;white-space:nowrap}
#menubar .brand small{font-weight:400;opacity:.75;font-size:11px;margin-left:6px}
#menubar button{background:transparent;color:#fff;border:1px solid transparent;border-radius:4px;padding:4px 10px;cursor:pointer}
#menubar button:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25)}
#menubar input{margin-left:auto;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:4px;padding:4px 8px;width:220px}
#toolbar{grid-column:1/4;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:5px 8px;background:#fff;border-bottom:1px solid var(--ln)}
.grp{display:flex;gap:3px;align-items:center;padding-right:8px;border-right:1px solid var(--ln)}
.grp:last-child{border-right:0}
.tb{border:1px solid var(--ln);background:#f8fafc;border-radius:5px;padding:4px 9px;cursor:pointer;white-space:nowrap}
.tb:hover{background:#e8f0fb}
.tb.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tb.sim.on{background:#f9a825;border-color:#f9a825;color:#222}
.sw{width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #9aa3ac;cursor:pointer;display:inline-block}
.sw.on{box-shadow:0 0 0 2px var(--ac)}
#palette{grid-row:3;overflow:auto;background:#fff;border-right:1px solid var(--ln);padding:6px}
#palette h4{margin:10px 4px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}
.pi{display:flex;align-items:center;gap:8px;padding:3px 5px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.pi:hover{background:#eef4fc}
.pi.on{background:#dceafc;border-color:#9cc2f0}
.pi svg{flex:none;background:#f3f5f8;border-radius:6px}
.pi span{line-height:1.15}
#wrap{grid-row:3;position:relative;overflow:hidden;background:#fbfcfd}
#cv{width:100%;height:100%;display:block;touch-action:none;user-select:none}
#cv.m-wire .th:hover{fill:rgba(21,101,192,.35)}
#cv.m-place,#cv.m-wall,#cv.m-room,#cv.m-wire{cursor:crosshair}
#cv.m-pan{cursor:grab}
#side{grid-row:3;overflow:hidden;background:#fff;border-left:1px solid var(--ln);display:flex;flex-direction:column}
.tabs{display:flex;border-bottom:1px solid var(--ln)}
.tabs button{flex:1;border:0;background:#f5f7fa;padding:8px 2px;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{background:#fff;border-bottom-color:var(--ac);font-weight:600}
#sideBody{overflow:auto;padding:10px;flex:1}
#sideBody h3{margin:2px 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
#sideBody h4{margin:14px 0 6px;font-size:13px}
.row{display:grid;grid-template-columns:118px 1fr;gap:6px;align-items:center;margin:5px 0}
.row label{color:var(--mu)}
.row input,.row select{width:100%;padding:3px 5px;border:1px solid #c9d1db;border-radius:4px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.btn{border:1px solid #c9d1db;background:#f8fafc;border-radius:5px;padding:5px 10px;cursor:pointer}
.btn:hover{background:#e8f0fb}
.btn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn.danger{color:var(--er);border-color:#e6b4b4}
.note{background:#f1f6fd;border:1px solid #cfe0f5;border-radius:6px;padding:7px 9px;margin:8px 0;color:#30425a;line-height:1.35}
.warnbox{background:#fff6e5;border-color:#f3d39b}
table.t{border-collapse:collapse;width:100%;font-size:12px}
table.t th,table.t td{border:1px solid #dde3ea;padding:3px 4px;text-align:left}
table.t th{background:#f1f4f8;font-weight:600}
table.t td.n{text-align:right}
table.t input,table.t select{width:100%;border:1px solid #d3dae3;border-radius:3px;padding:1px 2px;font-size:12px}
.iss{display:flex;gap:8px;padding:6px 6px;border-bottom:1px solid #eef1f4;cursor:pointer;line-height:1.3}
.iss:hover{background:#f5f8fc}
.dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:4px}
.l-error .dot{background:var(--er)}.l-warn .dot{background:var(--wa)}.l-info .dot{background:#64b5f6}.l-ok .dot{background:var(--ok)}
#badge{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:var(--er);color:#fff;font-size:11px}
#badge:empty{display:none}
#status{grid-column:1/4;display:flex;gap:16px;padding:3px 10px;background:#f1f4f8;border-top:1px solid var(--ln);color:#4a5563;font-size:12px}
#status #hint{flex:1}
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#263238;color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s;max-width:70vw;z-index:50}
#toast.show{opacity:1}
#toast.err{background:#b71c1c}
#modal{position:fixed;inset:0;background:rgba(15,25,40,.45);display:none;align-items:center;justify-content:center;z-index:40}
#modal.show{display:flex}
#modal .box{background:#fff;border-radius:10px;max-width:760px;max-height:85vh;overflow:auto;padding:18px 22px;box-shadow:0 12px 40px rgba(0,0,0,.3);line-height:1.45}
#modal h2{margin-top:0}
.chip{display:inline-block;padding:0 5px;border-radius:4px;color:#fff;font-size:11px;font-weight:600}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .7s linear infinite}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(14deg)}75%{transform:rotate(-14deg)}}
.ring{animation:ring .22s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.live{stroke-dasharray:4 8;animation:flow .5s linear infinite}
#print{display:none}
@keyframes hot{from{opacity:.15}to{opacity:.9}}
.hot{animation:hot .45s ease-in-out infinite alternate}
@keyframes pop{0%{opacity:.35}100%{opacity:1}}
.pop{animation:pop .35s ease-out}
@keyframes blink{50%{opacity:.25}}
.blink{animation:blink .5s steps(1) infinite}
#pview{position:absolute;right:12px;top:12px;width:760px;height:600px;max-width:calc(100% - 24px);max-height:calc(100% - 24px);background:#f4f6f8;border:1px solid #9aa5b1;border-radius:10px;box-shadow:0 14px 40px rgba(10,20,40,.35);display:none;flex-direction:column;overflow:hidden;resize:both;z-index:20;min-width:420px;min-height:320px}
#pview.show{display:flex}
.pvh{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 12px;background:#12355f;color:#fff;cursor:move;user-select:none}
.pvh b{flex:1}
.pvh button{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;border-radius:5px;padding:2px 9px;cursor:pointer}
.pvh button.on{background:#fff;color:#12355f}
.pvbody{flex:1;display:flex;min-height:0}
#pvSvgWrap{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#fbfcfd,#dde3e9);padding:8px}
#pvSvgWrap svg{width:100%;height:100%;user-select:none;touch-action:none}
#pvInfo{width:250px;overflow:auto;border-left:1px solid #cfd6de;background:#fff;padding:8px;font-size:12px}
.lcd{background:#1c2a1c;border-radius:8px;padding:8px 10px;color:#9eff9e;font-family:Consolas,"Courier New",monospace;box-shadow:inset 0 2px 6px rgba(0,0,0,.6);margin-bottom:8px}
.lcdt{font-size:10px;letter-spacing:.15em;color:#6fbf6f}
.lcdv{font-size:26px;font-weight:700;text-shadow:0 0 6px rgba(120,255,120,.6)}
.lcdv small{font-size:13px}
.lcdg{display:grid;grid-template-columns:1fr auto;gap:1px 8px;font-size:12px}
.lcdg span{color:#79c979}
.lcdoff{color:#7aa07a;font-size:12px;padding:6px 0}
.pvrow{display:flex;align-items:center;gap:6px;padding:5px 4px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.pvrow:hover,.pvrow.hl{background:#eef4fc;border-color:#c5dafb}
.pvrow.hotrow{background:#fff3e0}
.pvn{flex:1;min-width:0}.pvn b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}.pvn small{color:#64748b}
.bar{height:5px;background:#e3e8ee;border-radius:3px;margin-top:3px;overflow:hidden}.bar i{display:block;height:100%;border-radius:3px;transition:width .3s}
.pvs{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap}
.pvs.on{background:#e8f5e9;color:#2e7d32}.pvs.off{background:#eceff1;color:#607d8b}.pvs.trip{background:#ff6d00;color:#fff}
.pvtip{color:#64748b;line-height:1.35;margin-top:8px;border-top:1px solid #eef1f4;padding-top:6px}
.pvmain{display:flex;align-items:center;gap:6px;margin:4px 0 8px}
.pvmain select{padding:1px 3px;border:1px solid #c9d1db;border-radius:4px}
.pvmodel{display:grid;gap:4px;margin-bottom:8px}.pvmodel label{display:flex;flex-direction:column;font-size:11px;color:var(--mu)}.pvmodel select{padding:2px;border:1px solid #c9d1db;border-radius:4px;font-size:12px;color:var(--tx)}
.usage{font-size:12px}.usage.bad{color:#c62828}
.ro{display:block;padding:3px 4px;background:#eef1f4;border-radius:4px;color:var(--tx);font-size:12px}
.tb:disabled{opacity:.4;cursor:default;background:#f8fafc}
#status{align-items:center}
#status #hint{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#hov{color:#1565c0;font-weight:600;white-space:nowrap}
#saved{color:#2e7d32;white-space:nowrap}
.zc{display:flex;align-items:center;gap:4px;white-space:nowrap}
.zc button{border:1px solid var(--ln);background:#fff;border-radius:4px;padding:0 7px;cursor:pointer}
#ctx{position:fixed;display:none;min-width:220px;background:#fff;border:1px solid #c9d1db;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px;z-index:60}
#ctx button{display:flex;justify-content:space-between;gap:20px;width:100%;border:0;background:none;padding:6px 10px;border-radius:5px;cursor:pointer;text-align:left}
#ctx button:hover{background:#e8f0fb}
#ctx button span{color:#8a94a3;font-size:11px}
#ctx hr{border:0;border-top:1px solid #e3e8ee;margin:4px 0}
#ctx .mh{padding:6px 10px 2px;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
#ctx .chips{display:flex;flex-wrap:wrap;gap:4px;padding:4px 10px 6px}
#ctx .chips button{width:auto;padding:2px 6px;color:#fff;font-size:11px;font-weight:600}
#psearch{width:100%;padding:6px 8px;border:1px solid #c9d1db;border-radius:6px;margin:2px 0 4px}
.steps{list-style:none;padding:0;margin:0 0 6px}
.steps li{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #eef1f4}
.steps li b{flex:1;font-weight:500}
.steps .ck{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;background:#e3e8ee;color:#64748b;flex:none}
.steps li.done .ck{background:#2e7d32;color:#fff}
.steps li.done b{color:#64748b}
.steps .btn{padding:2px 8px;font-size:12px}
.rchips{display:flex;flex-wrap:wrap;gap:4px}
.rchips button{border:1px solid #c9d1db;background:#fff;border-radius:14px;padding:3px 9px;cursor:pointer;font-size:12px}
.rchips button.on{background:var(--ac)!important;border-color:var(--ac);color:#fff}
.ptabs{display:flex;gap:4px;margin-bottom:6px}.ptabs button{flex:1;border:1px solid #c9d1db;background:#f5f7fa;border-radius:6px;padding:6px 4px;cursor:pointer;font-weight:600}.ptabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#palette .rchips button{font-size:12px}
@media print{
 @page{size:landscape;margin:10mm}
 html,body{overflow:visible;height:auto;background:#fff}
 #app,#toast,#modal{display:none!important}
 #print{display:block}
 #print svg{width:100%;height:auto;max-height:180mm}
 #print .pg{page-break-after:always}
 #print table{font-size:10px}
}
</style>
</head>

<div id="app">
 <div id="menubar">
  <div class="brand">⚡ Diseño Eléctrico Residencial<small>RETIE · NTC 2050</small></div>
  <button data-m="new">Nuevo</button>
  <button data-m="open">Abrir…</button>
  <button data-m="save">Guardar</button>
  <button data-m="saveas">Guardar como…</button>
  <button data-m="png">Exportar imagen</button>
  <button data-m="print">Imprimir / PDF</button>
  <button data-m="sample">Casa de ejemplo</button>
  <button data-m="help">Ayuda</button>
  <input id="projName" title="Nombre del proyecto">
  <input id="fileIn" type="file" accept=".json,.elec,application/json" style="display:none">

 </div>
 <div id="toolbar">
  <div class="grp">
   <button class="tb" data-mode="select" title="Seleccionar y mover (V)">🖱 Seleccionar</button>

   <button class="tb" data-mode="wall" title="Dibujar muros (M)">🧱 Muro</button>
   <button class="tb" data-mode="room" title="Dibujar espacio / habitación (H)">⬚ Espacio</button>
   <button class="tb" data-mode="wire" title="Dibujar cable entre bornes (C)">〰 Cable</button>
   <button class="tb sim" data-mode="sim" title="Probar el circuito (S)">▶ Simular</button>

  <div class="grp" id="wireOpts">
   <span id="swatches"></span>
   <select id="gaugeSel" title="Calibre AWG por defecto"></select>
   <label title="Neutro blanco y tierra verde automáticamente según el borne"><input type="checkbox" id="autoColor" checked> color auto</label>
  </div>
  <div class="grp">
   <button class="tb" data-a="undo" title="Deshacer (Ctrl+Z)">↶</button>

   <button class="tb" data-a="del" title="Eliminar (Supr)">🗑</button>
   <button class="tb" data-a="pview" title="Ver el tablero real con sus tacos (T)">🗄 Tablero</button>

<script>
"use strict";
// =====================================================================
//  Utilidades
// =====================================================================
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1=n=>(Math.round(n*10)/10).toLocaleString('es-CO');
const f0=n=>Math.round(n).toLocaleString('es-CO');
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// =====================================================================
//  Datos normativos y de colores
// =====================================================================
const COLORS={
 negro:{n:'Negro',c:'#1d1d1d',o:'#000'}, rojo:{n:'Rojo',c:'#c62828',o:'#7f1414'}, azul:{n:'Azul',c:'#1e5bc6',o:'#0e357a'},
 amarillo:{n:'Amarillo',c:'#f2c200',o:'#9a7a00'}, blanco:{n:'Blanco',c:'#fafafa',o:'#8a8f96'}, gris:{n:'Gris',c:'#9aa0a6',o:'#5f656b'},
 verde:{n:'Verde',c:'#2e7d32',o:'#174d1a'}, verdeamarillo:{n:'Verde-amarillo',c:'#2e7d32',o:'#174d1a',stripe:'#f2c200'},
 desnudo:{n:'Desnudo (cobre)',c:'#cf8445',o:'#7a4519'}, naranja:{n:'Naranja',c:'#ef6c00',o:'#8a3e00'}, cafe:{n:'Café',c:'#6d4c41',o:'#3e2723'}
};
const NEU_COL=['blanco','gris'], GND_COL=['verde','verdeamarillo','desnudo'];
const GAUGES=['14','12','10','8','6','4'];
const AMP={'14':15,'12':20,'10':30,'8':40,'6':55,'4':70};          // NTC 2050 Tabla 310-16 (60 °C) con límites de la Secc. 240-3
const BREAKERS=[15,20,30,40,50,60,70];
const PSTYLES={metal:{n:'Metálico gris de empotrar',d:'tacos enchufables',sizes:[4,6,8,12,18,24,30,42]},blanco:{n:'Blanco de sobreponer',d:'tacos enchufables',sizes:[4,6,8,12,18,24]},riel:{n:'Modular riel DIN',d:'tacos tipo riel',sizes:[4,8,12,18,24,36]}};
const BKT={'1p':{n:'Sencillo · 1 polo (120 V)',s:'sencillo 1P',poles:1,dif:false},tandem:{n:'Doble tándem · 2 tacos en 1 espacio',s:'doble tándem (½ espacio)',poles:1,dif:false},'2p':{n:'Bipolar · 2 polos (240 V)',s:'bipolar 2P',poles:2,dif:false},dif:{n:'Diferencial GFCI · 1 polo',s:'diferencial 1P',poles:1,dif:true},'2pdif':{n:'Bipolar diferencial (240 V)',s:'bipolar diferencial 2P',poles:2,dif:true}};
function bkOf(c){if(!c.bk||!BKT[c.bk])c.bk=c.poles==2?(c.dif?'2pdif':'2p'):(c.dif?'dif':'1p');return c.bk}
function setBk(c,bk){c.bk=bk;const t=BKT[bk];c.poles=t.poles;c.dif=t.dif;if(c.poles==2)c.fase='AB'}
const PNL=()=>{if(!state.panel)state.panel={style:'metal',slots:12};return state.panel};
const panelDesc=()=>{const P=PNL();return `Tablero ${PSTYLES[P.style].n[0].toLowerCase()+PSTYLES[P.style].n.slice(1)} de ${P.slots} ${P.style==='riel'?'módulos':'espacios'}`};
const KINDS={
 iluminacion:{n:'Iluminación',br:15,g:'14',p:1},
 tomas:{n:'Tomas generales',br:20,g:'12',p:1},
 cocina:{n:'Cocina – pequeños artefactos',br:20,g:'12',p:1},
 lavanderia:{n:'Lavandería',br:20,g:'12',p:1},
 bano:{n:'Baño',br:20,g:'12',p:1},
 ducha:{n:'Ducha eléctrica 240 V',br:30,g:'10',p:2},
 estufa:{n:'Estufa 240 V',br:40,g:'8',p:2},
 especial:{n:'Especial / otro',br:20,g:'12',p:1}
};
const ROOMT={alcoba:'Alcoba',sala:'Sala',comedor:'Comedor',cocina:'Cocina',bano:'Baño',lavadero:'Lavadero / patio de ropas',garaje:'Garaje',exterior:'Exterior / balcón',pasillo:'Pasillo / escalera',estudio:'Estudio',otro:'Otro'};
const ROOMC={alcoba:'#e8f1fb',sala:'#fdf3e1',comedor:'#fbefd9',cocina:'#fde9e5',bano:'#e0f4f3',lavadero:'#e9f3e1',garaje:'#eeeeee',exterior:'#eef7e6',pasillo:'#f4f1fa',estudio:'#f0f4e6',otro:'#f5f5f5'};

const CCOL=['#1565c0','#c62828','#2e7d32','#6a1b9a','#ef6c00','#00838f','#ad1457','#4e342e','#283593','#558b2f','#00695c','#d84315'];

// =====================================================================
//  Dibujos realistas de los aparatos (coordenadas locales, centrados)

function rocker(cx,cy,w,h,on){
 return `<rect x="${cx-w/2}" y="${cy-h/2}" width="${w}" height="${h}" rx="1.6" fill="url(#gRocker)" stroke="#b3bac3" stroke-width=".6"/>`+
  `<rect x="${cx-w/2+.6}" y="${on?cy-h/2+.6:cy}" width="${w-1.2}" height="${h/2-.6}" rx="1.2" fill="rgba(60,70,80,.11)"/>`+
  `<rect x="${cx-.5}" y="${on?cy-h/2+2:cy+h/2-5}" width="1" height="3" rx=".5" fill="${on?'#43a047':'#a3abb4'}"/>`;
}
function face(cx,cy){ // cara de tomacorriente tipo NEMA 5-15 (usada en Colombia)
 return `<rect x="${cx-7}" y="${cy-6}" width="14" height="12" rx="5" fill="#f5f2eb" stroke="#b7b1a3" stroke-width=".6"/>`+
  `<rect x="${cx-4.3}" y="${cy-3.9}" width="1.4" height="4.3" rx=".3" fill="#2b2b2b"/>`+
  `<rect x="${cx+2.9}" y="${cy-4.4}" width="1.4" height="5.3" rx=".3" fill="#2b2b2b"/>`+
  `<path d="M${cx-1.25} ${cy+4.4} v-1.3 a1.25 1.25 0 0 1 2.5 0 v1.3 z" fill="#2b2b2b"/>`;
}
const tiny=(x,y,t,c='#8a929b',fs=3.4)=>`<text x="${x}" y="${y}" font-size="${fs}" fill="${c}" text-anchor="middle" font-family="Segoe UI,Arial" font-weight="600">${t}</text>`;
const halo=(r,cy=0)=>`<circle cx="0" cy="${cy}" r="${r}" fill="url(#gHalo)"/>`;

const DRAW={

  `<path d="M-2.5 4 L-2.5 -3 M2.5 4 L2.5 -3 M-2.5 -3 q1.25 -2.6 2.5 0 q1.25 2.6 2.5 0" fill="none" stroke="${on?'#ff8f00':'#8d7b5a'}" stroke-width="${on?1:.6}"/>`+
  `<ellipse cx="-4.5" cy="-11" rx="2.2" ry="3.6" fill="rgba(255,255,255,.75)" transform="rotate(-30 -4.5 -11)"/>`+
  `<rect x="-5.5" y="5" width="11" height="9" rx="1" fill="url(#gBase)" stroke="#6f767d" stroke-width=".5"/>`+
  `<path d="M-5.5 7.5h11M-5.5 10h11M-5.5 12.5h11" stroke="#7b8188" stroke-width=".5"/><path d="M-3 14h6l-1.5 3h-3z" fill="#333"/>`,
 led:(d,on)=>(on?halo(38):'')+`<circle r="16.5" cx=".8" cy="1.2" fill="rgba(0,0,0,.15)"/><circle r="16" fill="#f3f5f8" stroke="#aeb7c0" stroke-width=".7"/>`+
  `<circle r="12.5" fill="url(#${on?'gGlassOn':'gLed'})" stroke="#d0d7df" stroke-width=".5"/>`+
  [...Array(10)].map((_,i)=>{const a=i*Math.PI/5;return `<circle cx="${(8.5*Math.cos(a)).toFixed(2)}" cy="${(8.5*Math.sin(a)).toFixed(2)}" r="1" fill="${on?'#fff':'#cfd8e0'}"/>`}).join(''),
 aplique:(d,on)=>(on?halo(32,2):'')+`<rect x="-10" y="-17" width="20" height="6" rx="1.5" fill="url(#gMetal)" stroke="#7b848d" stroke-width=".5"/>`+

  `<path d="M-14 -6 Q-12 16 0 16 Q12 16 14 -6 Z" fill="${on?'url(#gGlassOn)':'#f2ecd9'}" stroke="#c4b994" stroke-width=".7"/>`+
  `<path d="M-14 -6 Q0 -2 14 -6" fill="none" stroke="#c4b994" stroke-width=".7"/>`,
 ventilador:(d,on)=>`<g class="${on?'spin':''}">`+[0,120,240].map(a=>`<g transform="rotate(${a})"><ellipse cx="12" cy="0" rx="11" ry="4.2" fill="url(#gWood)" stroke="#4e342e" stroke-width=".5"/><rect x="2" y="-1" width="5" height="2" fill="#777"/></g>`).join('')+`</g>`+
  `<circle r="6" fill="url(#gMetal)" stroke="#6b737c" stroke-width=".6"/><circle r="3.4" fill="url(#${on?'gGlassOn':'gGlassOff'})"/>`,
 timbre:(d,on)=>`<g class="${on?'ring':''}"><path d="M-10 6 Q-10 -12 0 -12 Q10 -12 10 6 L12.5 9 L-12.5 9 Z" fill="url(#gBrass)" stroke="#8a6d1a" stroke-width=".7"/>`+
  `<circle cx="0" cy="11.5" r="2.6" fill="#8a6d1a"/><circle cx="0" cy="-12.5" r="1.8" fill="#8a6d1a"/></g>`+(on?tiny(16,-8,'♪','#e65100',7)+tiny(-16,-4,'♪','#e65100',6):''),
 int_sencillo:(d)=>plate(28,40)+rocker(0,0,11,22,d.st[0]),
 int_doble:(d)=>plate(28,40)+rocker(-6,0,9,22,d.st[0])+rocker(6,0,9,22,d.st[1]),
 int_triple:(d)=>plate(28,40)+rocker(-8,0,6.6,22,d.st[0])+rocker(0,0,6.6,22,d.st[1])+rocker(8,0,6.6,22,d.st[2]),

  `<rect x="-8.5" y="-2.4" width="7.6" height="4.8" rx=".8" fill="#222"/><rect x=".9" y="-2.4" width="7.6" height="4.8" rx=".8" fill="#c62828"/>`+

 ducha:(d,on)=>`<circle r="15.5" cx=".8" cy="1.2" fill="rgba(0,0,0,.15)"/><circle r="15" fill="url(#gMetal)" stroke="#6b737c" stroke-width=".7"/><circle r="11" fill="${on?'#ffe0b2':'#d6dde4'}" stroke="#9aa3ac" stroke-width=".5"/>`+
  [...Array(19)].map((_,i)=>{if(i===0)return `<circle r=".9" fill="#56606a"/>`;const k=i<7?4:8,a=(i<7?i:i-7)*Math.PI/(i<7?3:6);return `<circle cx="${(k*Math.cos(a)).toFixed(2)}" cy="${(k*Math.sin(a)).toFixed(2)}" r=".9" fill="#56606a"/>`}).join('')+
  tiny(0,-16.8,'240 V','#c62828',3.6)+(on?`<g stroke="#4fc3f7" stroke-width=".8" opacity=".9"><path d="M-6 13 l-2 6M0 14 v6M6 13 l2 6"/></g>`:''),
 empalme:()=>`<path d="M-6 7 L-4.5 -7 Q0 -10.5 4.5 -7 L6 7 Z" fill="#ef6c00" stroke="#a84a00" stroke-width=".6"/><path d="M-5.3 2h10.6M-5 -2h10M-4.7 -5.5h9.4" stroke="#c25400" stroke-width=".6"/>`,

  `<rect x="-2" y="-17" width="4" height="36" rx="1" fill="url(#gCopper)" stroke="#7a4519" stroke-width=".4"/><rect x="-4.5" y="-14.5" width="9" height="5" rx="1" fill="url(#gMetal)" stroke="#6b737c" stroke-width=".5"/>`+tiny(9,4,'SPT','#5d4037',4),
 puerta:(d)=>{const w=d.w||90,f=d.flip?-1:1;return `<rect x="${-w/2}" y="-9" width="${w}" height="18" fill="#fbfcfd"/><g transform="scale(${f} 1)"><line x1="${-w/2}" y1="0" x2="${-w/2}" y2="${-w}" stroke="#5d4037" stroke-width="3"/>`+
  `<path d="M${-w/2} ${-w} A${w} ${w} 0 0 1 ${w/2} 0" fill="none" stroke="#8d6e63" stroke-width="1" stroke-dasharray="4 3"/></g>`},

  `<path d="M${-w/2} ${-h} A${h} ${h} 0 0 1 0 0 A${h} ${h} 0 0 1 ${w/2} ${-h}" fill="none" stroke="#8d6e63" stroke-width="1" stroke-dasharray="4 3"/>`},

 cama1:()=>`<rect x="-50" y="-95" width="100" height="190" rx="6" fill="#fff" stroke="#8d99a6" stroke-width="1.5"/><rect x="-40" y="-87" width="80" height="32" rx="9" fill="#eef2f6" stroke="#9aa5b1"/><rect x="-50" y="-42" width="100" height="137" rx="6" fill="#e3eedc" stroke="#8d99a6" stroke-width="1.2"/><path d="M-50 -22 H50" stroke="#c2d6b5" stroke-width="2"/>`,

// Tablero de distribución (dibujo dinámico según los circuitos)
function panelGeom(cs){

class UF{constructor(){this.p=new Map()}f(x){if(!this.p.has(x))this.p.set(x,x);let r=x;while(this.p.get(r)!==r)r=this.p.get(r);while(this.p.get(x)!==r){const n=this.p.get(x);this.p.set(x,r);x=n}return r}u(a,b){this.p.set(this.f(a),this.f(b))}}
function buildNet(withSwitches){

 state.wires.forEach(w=>uf.u(w.a.d+':'+w.a.t,w.b.d+':'+w.b.t));

}

  if(panel){
   if(state.mainOn!==false) state.circuits.forEach(c=>{if(!c.on)return;
    if(c.poles==2){add(panel.id+':C'+c.id+'a','L1',c.id);add(panel.id+':C'+c.id+'b','L2',c.id)}

function bounds(){
 let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9; const add=(x,y,m=0)=>{x1=Math.min(x1,x-m);y1=Math.min(y1,y-m);x2=Math.max(x2,x+m);y2=Math.max(y2,y+m)};
 state.rooms.forEach(r=>{add(r.x,r.y,95);add(r.x+r.w,r.y+r.h,20)}); state.walls.forEach(w=>{add(w.x1,w.y1,10);add(w.x2,w.y2,10)});
 state.devices.forEach(d=>{const [w,h]=bbOf(d);add(d.x,d.y,Math.max(w,h)/2*scaleOf(d)+12)}); state.wires.forEach(w=>w.pts.forEach(p=>add(p[0],p[1])));
 if(state.bg){add(state.bg.x,state.bg.y);add(state.bg.x+state.bg.w,state.bg.y+state.bg.h)}
 if(x1>x2) return {x:0,y:0,w:1000,h:700};
 return {x:x1-30,y:y1-30,w:x2-x1+60,h:y2-y1+60};
}
function fitView(){const b=bounds(),R=svg.getBoundingClientRect();if(!R.width)return;const z=clamp(Math.min(R.width/b.w,R.height/b.h)*.95,.08,4);state.view={z,x:(R.width-b.w*z)/2-b.x*z,y:(R.height-b.h*z)/2-b.y*z};render()}

function help(){
 $('#modalBox').innerHTML=`<h2>Guía rápida</h2>
 <ol>
 <li><b>Plano base (pestaña 🏠 Plano):</b> elija el tipo de espacio (alcoba, cocina, baño…) y arrastre un rectángulo. Los <b>muros y las medidas se dibujan solos</b>; los espacios se alinean con los vecinos. <b>Arrastre un muro</b> para mover la pared: los espacios se ajustan y los aparatos pegados a ella se mueven también. Inserte puertas, ventanas y muebles (se pegan al muro). También hay <b>plantillas</b> listas y puede cargar una imagen del plano como fondo.</li>
 <li><b>Tablero (pestaña ⚡ Eléctrico):</b> colóquelo desde la paleta. Se crean los circuitos básicos (iluminación, tomas, 2 de cocina, lavandería, baño). En la pestaña <b>Tablero</b> escoja el <b>modelo</b> (metálico de empotrar, blanco de sobreponer o riel DIN), la capacidad y el <b>tipo de cada taco</b> (sencillo, doble tándem, bipolar, diferencial). Todas las salidas del tablero bajan por la bornera inferior (C1, C2… N, T).</li>
 <li><b>Aparatos:</b> clic en la paleta y clic en el plano. <b>R</b> rota. Cada aparato se asigna automáticamente a un circuito según su tipo y el espacio donde está.</li>
 <li><b>Cables:</b> con <b>〰 Cable</b> haga clic en un borne (tornillo) y luego en otro. Escoja el color arriba. Los bornes de latón son fase, los plateados neutro y los verdes tierra.</li>
 <li><b>Conexión automática:</b> seleccione varios aparatos (Shift+clic o recuadro) y pulse <b>⚙ Conexión automática</b>. Ejemplos: un bombillo y un interruptor; un bombillo y dos conmutables (2 sitios); un bombillo, dos conmutables y un cruce (3 sitios); varios tomacorrientes.</li>
 <li><b>▶ Simular:</b> accione interruptores y breakers y vea qué se enciende. Si hay un cortocircuito el breaker se dispara.</li>
 <li><b>Revisión:</b> la pestaña Revisión lista los incumplimientos detectados (RETIE / NTC 2050). Haga clic en uno para ubicarlo.</li>
 <li><b>Guardar / Imprimir:</b> el trabajo se guarda solo en este equipo, y con <b>Guardar</b> lo exporta a un archivo. <b>Imprimir / PDF</b> genera el plano, el cuadro de cargas y los materiales.</li>
 </ol>
 <h3>Atajos</h3><p>V seleccionar · M muro · H espacio · C cable · S simular · R rotar · Supr eliminar · Ctrl+Z / Ctrl+Y deshacer / rehacer · Ctrl+C / Ctrl+V copiar y pegar (donde esté el ratón) · Ctrl+D duplicar · Flechas mover fino (Shift: 50 cm) · Ctrl+S guardar · Rueda zoom · Espacio+arrastrar desplazar · Esc terminar.</p>
 <h3>Simulación interactiva</h3><p>En <b>▶ Simular</b>: accione interruptores, mantenga presionado el pulsador para que suene el timbre, haga clic en los <b>tomacorrientes para conectar aparatos</b> (TV, licuadora, plancha…) y en la ducha o la estufa para encenderlas. Abra el <b>🗄 Tablero</b> (tecla T) para ver los tacos reales, el medidor de energía y la corriente de cada circuito. Si conecta demasiados aparatos, los cables se ponen naranja y el taco <b>se dispara por sobrecarga</b>. Un taco disparado se rearma bajándolo a OFF y luego subiéndolo a ON. Arrastrando un taco a otra fila cambia su fase (A o B).</p>
 <h3>Trucos</h3><p><b>Clic derecho</b> sobre cualquier cosa abre un menú (rotar, duplicar, asignar circuito, cablear…). Los interruptores y tomacorrientes <b>se pegan al muro</b> y miran hacia el espacio (Alt para ubicarlos libres). Con <b>Ver:</b> (barra superior) o el 👁 de la pestaña Tablero se muestra un solo circuito. Puede <b>arrastrar</b> aparatos desde la paleta y <b>buscarlos</b> por nombre. Pase el ratón sobre un borne para saber qué es.</p>
 <h3>Conexiones típicas</h3>
 <p><b>Sencillo:</b> fase → COM del interruptor; S → F del bombillo (retorno); neutro → N del bombillo.<br>
 <b>Desde 2 sitios (conmutables):</b> fase → COM del 1.º; V1 y V2 del 1.º → V1 y V2 del 2.º (viajeros); COM del 2.º → bombillo; neutro → bombillo.<br>
 <b>Desde 3 o más sitios:</b> igual, pero los viajeros pasan por cada interruptor de cruce (A1/A2 entran, B1/B2 salen).</p>
 <p style="font-size:12px;color:#555">Herramienta de apoyo para diseño y aprendizaje. No reemplaza el criterio ni la firma de un profesional competente. Verifique siempre contra el RETIE y la NTC 2050 vigentes.</p>

// Posiciones de los tacos. Enchufables: dos columnas, posición s → fila s>>1, columna s&1; las filas alternan fase A/B.
// Riel DIN: módulos en fila (12 por riel); la barra peine alterna la fase A/B por módulo.
function panelLayout(){const P=PNL();return P.style==='riel'?layoutDIN(P):layoutPlug(P)}
function layoutPlug(P){
 const occ=new Map(), pos={}, K=(r,c)=>r+','+c, cap=Math.max(1,P.slots>>1);
 const nOf=c=>c.poles==2?2:1;
 const free=(c,r,col)=>{if(bkOf(c)==='tandem'){const o=occ.get(K(r,col));return !o||(Array.isArray(o)&&o.length<2)}for(let k=0;k<nOf(c);k++)if(occ.has(K(r+k,col)))return false;return true};
 const take=(c,r,col)=>{let half=null;if(c.bk==='tandem'){const o=occ.get(K(r,col))||[];o.push(c.id);occ.set(K(r,col),o);half=o.length-1}else for(let k=0;k<nOf(c);k++)occ.set(K(r+k,col),'F');
  pos[c.id]={row:r,col,n:nOf(c),half,slot:r*2+col,fase:c.poles==2?'AB':(r%2===0?'A':'B')}};
 state.circuits.forEach(c=>{if(c.slot!=null){const r=c.slot>>1,col=c.slot&1;if(free(c,r,col))take(c,r,col)}});
 state.circuits.forEach(c=>{if(pos[c.id])return;for(let s=0;;s++){const r=s>>1,col=s&1;if(free(c,r,col)){c.slot=s;take(c,r,col);break}}});
 let rows=0; Object.values(pos).forEach(p=>rows=Math.max(rows,p.row+p.n));
 const overflow=new Set(Object.entries(pos).filter(([,p])=>p.row+p.n>cap).map(([id])=>id));
 return {style:'plug',pos,rows,occ,cap,overflow,used:occ.size,total:cap*2};
}
function layoutDIN(P){
 const per=12, occ=new Set(), pos={}, nOf=c=>(c.poles==2||bkOf(c)==='dif')?2:1;
 const fits=(m,k)=>{if(Math.floor(m/per)!==Math.floor((m+k-1)/per))return false;for(let i=0;i<k;i++)if(occ.has(m+i))return false;return true};
 const take=(c,m)=>{const k=nOf(c);for(let i=0;i<k;i++)occ.add(m+i);pos[c.id]={mod:m,n:k,rail:Math.floor(m/per),x:m%per,slot:m,fase:c.poles==2?'AB':(m%2===0?'A':'B')}};
 state.circuits.forEach(c=>{if(c.slot!=null&&fits(c.slot,nOf(c)))take(c,c.slot)});
 state.circuits.forEach(c=>{if(pos[c.id])return;for(let m=0;;m++)if(fits(m,nOf(c))){c.slot=m;take(c,m);break}});
 let maxM=0; occ.forEach(m=>maxM=Math.max(maxM,m+1));
 const overflow=new Set(Object.entries(pos).filter(([,p])=>p.mod+p.n>P.slots).map(([id])=>id));
 return {style:'din',pos,occ,per,cap:P.slots,rails:Math.max(Math.ceil(P.slots/per),Math.ceil(maxM/per),1),overflow,used:occ.size,total:P.slots};
}

 <div class="usage ${L.overflow.size?'bad':''}">Ocupados: <b>${L.style==='din'?L.used:Math.round(L.used)} de ${L.total}</b>${L.overflow.size?' – ¡no caben todos los tacos!':''}<div class="bar"><i style="width:${Math.min(100,L.used/L.total*100)}%;background:${L.overflow.size?'#e53935':L.used/L.total>.85?'#fb8c00':'#43a047'}"></i></div></div></div>`}
function bindModel(id){
 const sS=$('#'+id+'S'), sN=$('#'+id+'N'); if(!sS) return;
 sS.onchange=e=>upd(()=>{const P=PNL();P.style=e.target.value;const sz=PSTYLES[P.style].sizes;if(!sz.includes(P.slots))P.slots=sz.find(n=>n>=P.slots)||sz[sz.length-1];state.circuits.forEach(c=>{c.slot=null;if(P.style==='riel'&&c.bk==='tandem')setBk(c,'1p')})});
 sN.onchange=e=>upd(()=>PNL().slots=+e.target.value);
}
function pvInfoHTML(){
 const sim=mode==='sim'?simRes:null;
 let h=modelSelects('pvm')+`<div class="lcd"><div class="lcdt">MEDIDOR DE ENERGÍA</div>`;
 if(sim){const kW=sim.W/1000;h+=`<div class="lcdv">${kW.toFixed(2)} <small>kW</small></div><div class="lcdg"><span>Fase A</span><b>${sim.A.toFixed(1)} A</b><span>Fase B</span><b>${sim.B.toFixed(1)} A</b><span>Neutro</span><b>${Math.abs(sim.nA-sim.nB).toFixed(1)} A</b><span>Costo / hora</span><b>$ ${f0(kW*(state.tarifa||0))}</b></div>`}
 else h+=`<div class="lcdoff">Pulse <b>▶ Simular</b> para ver el consumo y las corrientes en vivo.</div>`;
 h+=`</div><div class="pvmain"><span>Totalizador</span><select id="pvMainA">${[30,40,50,60,70,80,100,125].map(a=>`<option ${a==state.mainA?'selected':''}>${a}</option>`).join('')}</select><span>A</span><span class="pvs ${state.mainTrip?'trip':state.mainOn!==false?'on':'off'}" style="margin-left:auto">${state.mainTrip?'DISPARADO':state.mainOn!==false?'ON':'OFF'}</span></div>`;
 state.circuits.forEach((c,i)=>{
  const on=c.on&&!c.tripped&&state.mainOn!==false, I=sim&&on?(sim.amps[c.id]||0):0, r=I/c.breaker, col=r>1?'#e53935':r>.8?'#fb8c00':'#43a047', hot=(ovAcc[c.id]||0)>0;
  h+=`<div class="pvrow ${pv.hoverC===c.id||settings.viewC===c.id?'hl':''} ${hot?'hotrow':''}" data-pr="${c.id}" title="Clic: ver solo este circuito en el plano"><span class="chip" style="background:${CCOL[i%CCOL.length]}">C${i+1}</span>
   <div class="pvn"><b>${esc(c.name)}</b><small>${BKT[bkOf(c)].s} · ${c.poles==2?'A-B':'Fase '+c.fase} · ${c.breaker} A · ${c.gauge} AWG</small>${sim?`<div class="bar"><i style="width:${Math.min(100,r*100)}%;background:${col}"></i></div>`:''}</div>
   <span class="pvs ${c.tripped?'trip':c.on?'on':'off'} ${hot?'blink':''}">${c.tripped?'TRIP':c.on?(sim&&on?f1(I)+' A':'ON'):'OFF'}</span></div>`;
 });
 if(sim) h+=`<div class="row" style="grid-template-columns:1fr 90px;margin-top:8px"><label>Tarifa ($/kWh)</label><input id="pvTar" type="number" value="${state.tarifa}"></div>`;
 h+=`<div class="pvtip"><b>Cómo usar:</b><br>• Clic en un taco: subir / bajar.<br>• Arrastre un taco a otra posición: la fila define la fase (A o B).<br>• En ▶ Simular: clic en un tomacorriente para conectar aparatos; si se pasa de la capacidad, el taco se calienta y se dispara.<br>• Un taco disparado se rearma bajándolo a OFF y subiéndolo a ON.</div>`;
 return h;
}
function renderPview(){
 if(!pv.open) return;
 const wrap=$('#pvSvgWrap'); wrap.innerHTML=pvSVG();
 $('#pvInfo').innerHTML=pvInfoHTML();
 document.querySelectorAll('[data-pvl]').forEach(b=>b.classList.toggle('on',b.dataset.pvl===pv.level));
 const an=document.getElementById('pvAnim'); if(an&&an.beginElement) an.beginElement(); pv.anim=null;
 const da=document.getElementById('pvDoorAnim'); if(da&&da.beginElement){da.beginElement(); const kind=pv.doorAnim; pv.doorAnim=null; setTimeout(()=>{if(kind==='open')renderPview()},420)}
 bindModel('pvm');
 const mA=$('#pvMainA'); if(mA) mA.onchange=e=>upd(()=>state.mainA=+e.target.value);
 const tar=$('#pvTar'); if(tar) tar.onchange=e=>{state.tarifa=+e.target.value;changed()};
 $('#pvInfo').querySelectorAll('[data-pr]').forEach(el=>{el.onclick=()=>setViewC(settings.viewC===el.dataset.pr?'':el.dataset.pr);el.onmouseenter=()=>pvHover(el.dataset.pr);el.onmouseleave=()=>pvHover('')});
}
function pvHover(cid){
 if(pv.hoverC===cid) return; pv.hoverC=cid;
 const v=state.view; $('#layer').innerHTML=worldSVG({ui:true,grid:settings.grid,labels:settings.showLabels&&(v.z>.45||mode==='wire'),sim:simRes});
 document.querySelectorAll('#pvsvg [data-pb]').forEach(el=>{const r=el.querySelector('rect:nth-of-type(2)');if(r){r.setAttribute('stroke',el.dataset.pb===cid?'#42a5f5':'#000');r.setAttribute('stroke-width',el.dataset.pb===cid?2.5:.8)}});
 document.querySelectorAll('#pvInfo [data-pr]').forEach(el=>el.classList.toggle('hl',el.dataset.pr===cid||settings.viewC===el.dataset.pr));
}
function pvPoint(e){const sv=$('#pvsvg');const pt=sv.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(sv.getScreenCTM().inverse())}
$('#pvSvgWrap').addEventListener('pointerdown',e=>{
 if(e.button!==0) return;
 const act=e.target.closest('[data-pvact]'); if(act){pv.level='cover';pv.doorAnim='open';sfx('clack');renderPview();return}
 if(e.target.closest('[data-pmain]')){toggleMain();return}
 const b=e.target.closest('[data-pb]'); if(!b) return;
 const q=pvPoint(e); pv.drag={cid:b.dataset.pb,el:b,sx:q.x,sy:q.y,moved:false,cx:e.clientX,cy:e.clientY};
 $('#pvSvgWrap').setPointerCapture(e.pointerId); e.preventDefault();
});
function pvTarget(q,c){
 const g=pvGeom(), L=g.L;
 if(g.din){const n=(c.poles==2||bkOf(c)==='dif')?2:1, rail=clamp(Math.floor((q.y-g.top)/g.RAILH),0,g.rails-1), x=clamp(Math.floor((q.x-g.left)/g.MW),0,g.per-n);
  return {slot:rail*g.per+x,box:dinBox(g,{x,rail,n}),cells:[...Array(n)].map((_,i)=>rail*g.per+x+i)}}
 const n=c.poles==2?2:1, col=q.x<g.cx?0:1, row=clamp(Math.floor((q.y-g.top)/g.RH),0,g.rows-n);
 return {slot:row*2+col,box:brkBox(g,{row,col,n}),cells:[...Array(n)].map((_,k)=>(row+k)+','+col)};
}
function cellsOf(L,p){return L.style==='din'?[...Array(p.n)].map((_,i)=>p.mod+i):[...Array(p.n)].map((_,k)=>(p.row+k)+','+p.col)}
$('#pvSvgWrap').addEventListener('pointermove',e=>{
 const d=pv.drag;
 if(!d){const b=e.target.closest&&e.target.closest('[data-pb]');pvHover(b?b.dataset.pb:'');return}
 if(!d.moved&&Math.hypot(e.clientX-d.cx,e.clientY-d.cy)<6) return;
 d.moved=true; const q=pvPoint(e), c=circ(d.cid);
 d.el.setAttribute('transform',`translate(${q.x-d.sx} ${q.y-d.sy})`); d.el.style.opacity=.8; d.el.style.cursor='grabbing';
 const T=pvTarget(q,c); d.target=T; const t=$('#pvTarget'); Object.entries({x:T.box.x-3,y:T.box.y-3,width:T.box.w+6,height:T.box.h+6}).forEach(([k,v])=>t.setAttribute(k,v)); t.style.display='';
});
$('#pvSvgWrap').addEventListener('pointerup',e=>{
 const d=pv.drag; pv.drag=null; if(!d) return;
 if(!d.moved){toggleBreaker(d.cid);return}
 const c=circ(d.cid), L=panelLayout(), old=L.pos[c.id].slot, T=d.target;
 if(!T||T.slot===old){renderPview();return}
 pushUndo();
 const occ=state.circuits.filter(o=>o!==c&&cellsOf(L,L.pos[o.id]).some(k=>T.cells.includes(k)));
 const share=bkOf(c)==='tandem'&&occ.length===1&&occ[0].bk==='tandem'&&L.style!=='din'&&state.circuits.filter(o=>o!==c&&o.bk==='tandem'&&o.slot===T.slot).length<2;
 if(!share) occ.forEach(o=>o.slot=old);
 c.slot=T.slot; sfx('clack'); changed();
 const p=panelLayout().pos[c.id]; toast(`${cName(c.id)} movido a la posición ${p.slot+1}${c.poles==2?'':' · ahora en fase '+c.fase}${share?' (comparte espacio con otro taco tándem)':''}.`);
});
$('#pvSvgWrap').addEventListener('pointerleave',()=>{if(!pv.drag)pvHover('')});
document.querySelectorAll('[data-pvl]').forEach(b=>b.onclick=()=>{const was=pv.level;pv.level=b.dataset.pvl;if(was==='door'&&pv.level!=='door')pv.doorAnim='open';else if(pv.level==='door'&&was!=='door')pv.doorAnim='close';sfx('clack');renderPview()});
$('#pvClose').onclick=closePview;
(()=>{const head=$('#pvHead'),win=$('#pview');let st=null;
 head.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const r=win.getBoundingClientRect(),pr=$('#wrap').getBoundingClientRect();st={x:e.clientX,y:e.clientY,l:r.left-pr.left,t:r.top-pr.top};head.setPointerCapture(e.pointerId)});
 head.addEventListener('pointermove',e=>{if(!st)return;win.style.right='auto';win.style.left=Math.max(0,st.l+e.clientX-st.x)+'px';win.style.top=Math.max(0,st.t+e.clientY-st.y)+'px'});
 head.addEventListener('pointerup',()=>st=null);})();
// sobrecarga térmica (curva inversa): cuanto mayor la sobrecorriente, más rápido se dispara
let lastTick=performance.now();
setInterval(()=>{
 const now=performance.now(), dt=Math.min(1,(now-lastTick)/1000); lastTick=now;
 if(mode!=='sim'||!simRes) return;
 const trips=[]; let flip=false;
 const step=(key,I,In)=>{const r=I/In, prev=ovAcc[key]||0; if(r>1.0){ovAcc[key]=prev+dt/clamp(5/(r*r-1),.4,45);if(ovAcc[key]>=1)trips.push([key,I,In])}else ovAcc[key]=Math.max(0,prev-dt/6); if((prev>0)!==((ovAcc[key]||0)>0))flip=true};
 state.circuits.forEach(c=>{if(c.on&&!c.tripped&&state.mainOn!==false)step(c.id,simRes.amps[c.id]||0,c.breaker);else ovAcc[c.id]=0});
 if(state.mainOn!==false) step('main',Math.max(simRes.A,simRes.B),state.mainA||60);
 if(trips.length){
  trips.forEach(([k,I,In])=>{ovAcc[k]=0;if(k==='main'){state.mainOn=false;state.mainTrip=true;toast(`¡Sobrecarga en el TOTALIZADOR! ${f1(I)} A en una fase con totalizador de ${In} A. Se disparó para proteger la acometida.`,true)}
   else{const c=circ(k);c.on=false;c.tripped=true;toast(`¡Sobrecarga en ${cName(k)} (${c.name})! ${f1(I)} A en un taco de ${In} A: se calentó y se disparó para proteger el cable ${c.gauge} AWG. Desconecte aparatos y rearme el taco (OFF → ON).`,true)}});
  sfx('trip'); changed();
 } else if(flip) render();
},250);

// =====================================================================
//  Menú e inicio
// =====================================================================
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
 const m=b.dataset.m;
 if(m==='new'){if(confirm('¿Crear un proyecto nuevo? (El actual se puede deshacer con Ctrl+Z)')){pushUndo();const u=undoS;state=newState();undoS=u;sel.clear();fileHandle=null;changed();fitView()}}
 if(m==='open') $('#fileIn').click();
 if(m==='save') saveFile(false);
 if(m==='saveas') saveFile(true);
 if(m==='png') exportPNG();
 if(m==='print') printDoc();
 if(m==='sample'){if(state.devices.length&&!confirm('¿Cargar la casa de ejemplo? El proyecto actual se reemplaza (puede deshacer con Ctrl+Z).'))return;const prev=ser();buildSample();undoS=[prev];changed();fitView();toast('Casa de ejemplo cargada. Pulse ▶ Simular y haga clic en los interruptores.')}
 if(m==='help') help();
});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;
 if(a==='undo')undo(); if(a==='redo')redo(); if(a==='rot')rotSel(); if(a==='del')delSel();
 if(a==='dup')duplicate(); if(a==='pview')(pv.open?closePview():openPview());
 if(a==='auto'){const ids=[...sel].filter(k=>k[0]==='d').map(k=>k.slice(2));if(ids.length)autoConnect(ids);else if(confirm('No hay nada seleccionado.\n\n¿Cablear automáticamente TODOS los aparatos que aún no tienen cables, espacio por espacio?'))autoWireAll()}
 if(a==='fit')fitView();
 if(a==='zin'||a==='zout'){const R=svg.getBoundingClientRect(),v=state.view,f=a==='zin'?1.25:.8,mx=R.width/2,my=R.height/2;v.x=mx-(mx-v.x)*f;v.y=my-(my-v.y)*f;v.z*=f;render()}});
$('#projName').onchange=e=>{state.name=e.target.value;changed()};
$('#gaugeSel').onchange=e=>settings.gauge=e.target.value;
$('#autoColor').onchange=e=>settings.autoColor=e.target.checked;
$('#showLabels').onchange=e=>{settings.showLabels=e.target.checked;render()};
$('#showGrid').onchange=e=>{settings.grid=e.target.checked;render()};
$('#viewC').onchange=e=>setViewC(e.target.value);
$('#showDims').onchange=e=>{settings.dims=e.target.checked;render()};

buildPalette(); buildToolbar();
const had=loadLocal();
if(!had){buildSample();}
buildPalette();
setMode('select');
requestAnimationFrame(()=>{fitView(); if(!had) setTimeout(help,300)});
</script>
